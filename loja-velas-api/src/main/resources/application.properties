# ---------- Banco de dados ----------
spring.datasource.url=jdbc:mysql://localhost:3306/loja_velas?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# O schema é criado pelo script database/loja_velas.sql, então o Hibernate não mexe nas tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Servidor / documentação ----------
spring.config.import=optional:file:./config-local.properties

server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
